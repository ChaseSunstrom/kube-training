# The Service in front of pod B. It only sends traffic to pods that are
# Ready, so clients never reach the app while it is still waiting for the
# seed Job (pods in the Init phase are never Ready).
#
# Test it from inside the cluster:
#   kubectl -n lab-rwo-sequential run curl --rm -it --restart=Never \
#     --image=curlimages/curl:8.11.1 -- curl -s http://web
# or from your laptop:
#   kubectl -n lab-rwo-sequential port-forward svc/web 8080:80   # then open http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-rwo-sequential
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
