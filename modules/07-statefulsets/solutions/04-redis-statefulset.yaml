# Solution to exercise 4 - a single Redis instance whose data survives pod
# deletion.
#
# By default Redis keeps data in memory and only writes snapshots
# (/data/dump.rdb - the redis image's working dir is /data) every few minutes
# and on a clean shutdown. So a plain `kubectl delete pod` keeps the key even
# without AOF, but a crash, OOM kill or node failure loses every write since
# the last snapshot. --appendonly yes logs every write to /data as it happens.
# Simulate a crash and compare:
#   kubectl exec -n lab-statefulsets redis-0 -- redis-cli set crash-test 1
#   kubectl exec -n lab-statefulsets redis-0 -- redis-cli shutdown nosave   # exit without saving
#   # ... a few seconds later the container has restarted (RESTARTS 1):
#   kubectl exec -n lab-statefulsets redis-0 -- redis-cli get crash-test   # 1 with AOF, empty without
#
#   kubectl apply -f solutions/04-redis-statefulset.yaml
#   kubectl rollout status sts/redis -n lab-statefulsets
#   kubectl exec -n lab-statefulsets redis-0 -- redis-cli set course kube-training
#   kubectl delete pod redis-0 -n lab-statefulsets
#   kubectl wait -n lab-statefulsets --for=condition=Ready pod/redis-0
#   kubectl exec -n lab-statefulsets redis-0 -- redis-cli get course   # kube-training
#
# This is ONE instance. Turning it into a replicated, failover-capable Redis
# needs configuration that depends on which pod is primary - exactly the kind
# of logic an operator provides (see the README).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lab-statefulsets
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: lab-statefulsets
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
