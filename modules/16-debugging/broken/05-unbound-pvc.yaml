# Broken app 05 - "uploads"
#
#   kubectl apply -f modules/16-debugging/broken/05-unbound-pvc.yaml
#
# Ticket: "The uploads service has been Pending since it was deployed. The
# cluster has plenty of free CPU and memory."
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: lab-debugging
  labels:
    app: uploads
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploads
  namespace: lab-debugging
  labels:
    app: uploads
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO volume: never run old and new pod at the same time
  selector:
    matchLabels:
      app: uploads
  template:
    metadata:
      labels:
        app: uploads
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "echo ready > /data/status; sleep 86400"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 20m, memory: 16Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uploads-data
