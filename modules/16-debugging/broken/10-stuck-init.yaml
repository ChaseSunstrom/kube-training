# Broken app 10 - "inventory" and its Redis
#
#   kubectl apply -f modules/16-debugging/broken/10-stuck-init.yaml
#
# Ticket: "inventory has been 'Init:0/1' for ten minutes. Redis is up."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-redis
  namespace: lab-debugging
  labels:
    app: inventory-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-redis
  template:
    metadata:
      labels:
        app: inventory-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-redis
  namespace: lab-debugging
  labels:
    app: inventory-redis
spec:
  selector:
    app: inventory-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: lab-debugging
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        # Wait until the cache answers before starting the app.
        - name: wait-for-cache
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 inventory-cache 6379; do
                echo "$(date -Iseconds) waiting for inventory-cache:6379 ..."
                sleep 3
              done
              echo "cache is up"
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 20m, memory: 16Mi }
      containers:
        - name: app
          image: redis:7.4-alpine          # stand-in app: uses redis-cli as its "client"
          env:
            - name: REDIS_HOST
              value: inventory-redis
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) items in stock: $(redis-cli -h "$REDIS_HOST" INCR stock)"
                sleep 5
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
