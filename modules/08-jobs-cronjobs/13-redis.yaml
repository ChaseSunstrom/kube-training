# 13 - A small Redis, the "database" for the seed/migration Job (14) and the
# work-queue exercise.
#
# No volume on purpose: the data lives in memory and is gone when the pod
# restarts - this module is about Jobs. For a Redis that keeps its data see
# the StatefulSet exercise in modules/07-statefulsets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lab-jobs
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lab-jobs
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
