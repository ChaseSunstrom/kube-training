# Exercise 2 - solution: 01-pod-root.yaml made "restricted"-compliant and
# deployed into lab-security-restricted.
#
#   kubectl apply -f modules/15-security/solutions/ex2-as-root-restricted.yaml
#   kubectl -n lab-security-restricted exec not-root-anymore -- id
#
# The image (busybox) defaults to root, so runAsNonRoot alone is not enough:
# the kubelet would refuse to start it ("image will run as root"). Pick a uid.
apiVersion: v1
kind: Pod
metadata:
  name: not-root-anymore
  namespace: lab-security-restricted
  labels:
    app: not-root-anymore
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
