# 06 - Don't hand every pod an API credential it never uses.
#
#   kubectl apply -f modules/15-security/06-serviceaccount-no-automount.yaml
#   kubectl -n lab-security exec as-root  -- ls /var/run/secrets/kubernetes.io/serviceaccount
#   kubectl -n lab-security exec no-token -- ls /var/run/secrets/kubernetes.io/serviceaccount
#
# By default every pod gets a projected, auto-rotated, time-limited token for
# its ServiceAccount ("default" if you don't pick one) mounted at
# /var/run/secrets/kubernetes.io/serviceaccount/token. If the pod is
# compromised, that token is the attacker's ticket to the API server - with
# whatever RBAC the ServiceAccount has (module 11).
#
# Two switches, and the pod-level one wins:
#   ServiceAccount.automountServiceAccountToken: false   default for all its pods
#   Pod.spec.automountServiceAccountToken: true|false    per-pod override
#
# Good practice: one ServiceAccount per app (never share "default"), automount
# off unless the app really calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-token
  namespace: lab-security
  labels:
    app: no-token
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: no-token
  namespace: lab-security
  labels:
    app: no-token
spec:
  serviceAccountName: no-token
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
