# 08 - Secrets hygiene: mount as files, read-only, readable only by the app.
#
#   kubectl apply -f modules/15-security/08-secret-hygiene.yaml
#   kubectl -n lab-security exec secret-reader -- ls -ln /etc/creds/..data/
#   kubectl -n lab-security exec secret-reader -- cat /etc/creds/password
#   kubectl -n lab-security get secret db-creds -o jsonpath='{.data.password}' | base64 -d; echo
#
# The last command is the lesson: a Secret is only base64-ENCODED, not
# encrypted. Anyone who can `get` it (or `list` the namespace's secrets, or
# create a pod that mounts it, or read etcd backups) can read it. So:
#   * restrict get/list/watch on secrets with RBAC (module 11) - "list" leaks
#     every value, not just names;
#   * have the cluster admin enable encryption at rest (EncryptionConfiguration,
#     ideally with a KMS v2 provider);
#   * never commit real Secret YAML to git - use Sealed Secrets / SOPS, or keep
#     the source of truth in a vault (External Secrets Operator, Secrets Store
#     CSI driver).
# This file is a demo with a fake password - it is fine to commit.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: lab-security
  labels:
    app: secret-reader
type: Opaque
immutable: true           # can't be edited (only deleted + recreated): protects
                          # against accidental changes and lets the kubelet stop
                          # watching it - less API server load at scale
stringData:               # write plain text here; the API server stores base64 in .data
  username: app
  password: not-a-real-password
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: lab-security
  labels:
    app: secret-reader
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000            # Secret files get group 1000, so mode 0440 lets the app read them
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 86400"]
      # Prefer files to env vars: env vars are inherited by every child
      # process, show up in /proc/<pid>/environ, crash reports and "print
      # all config" debug pages, and are never updated when the Secret changes.
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
  volumes:
    - name: creds
      secret:
        secretName: db-creds
        defaultMode: 0440    # owner+group read; nobody else. (YAML octal - in JSON write 288)
