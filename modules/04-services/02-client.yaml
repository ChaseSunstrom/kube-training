# 02 - A debugging client inside the cluster: nicolaka/netshoot has curl,
# dig, nslookup, nc, tcpdump, ... Every in-cluster test in this module runs
# from here:
#
#   kubectl exec -n lab-services client -- curl -s http://whoami
#   kubectl exec -n lab-services client -- dig +short whoami.lab-services.svc.cluster.local
#   kubectl exec -it -n lab-services client -- bash      # interactive
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab-services
  labels:
    app: client
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:v0.13
      command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 200m, memory: 128Mi }
