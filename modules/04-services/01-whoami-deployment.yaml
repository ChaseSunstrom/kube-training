# 01 - The backend every Service in this module points at.
#
# traefik/whoami answers each HTTP request with the pod that served it
# ("Hostname: whoami-xxxx"), so you can SEE load balancing, stickiness and
# readiness at work. It also has a /health endpoint whose status code you
# can change at runtime (POST a code to /health) - perfect for readiness demos.
#
#   kubectl apply -f modules/04-services/01-whoami-deployment.yaml
#   kubectl get pods -n lab-services -l app=whoami -o wide
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: lab-services
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            # A NAMED port. Services refer to it as `targetPort: http`, so the
            # container port number can change without touching any Service.
            - name: http
              containerPort: 80
          readinessProbe:
            # Not Ready -> removed from every Service's endpoints (step 5).
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
