# 02 - Clients to test from: curlimages/curl (curl + busybox nslookup, nc).
#
#   lab-netpol/frontend       app=frontend   the "legitimate" client
#   lab-netpol/intruder       app=intruder   same namespace, wrong label
#   lab-netpol-other/frontend app=frontend   same LABEL, other namespace
#   lab-netpol-other/intruder app=intruder   other namespace, wrong label
#
# Test with e.g.
#   kubectl -n lab-netpol exec frontend -- curl -s -m 3 http://backend
# A blocked connection doesn't get "connection refused": the packets are
# silently DROPPED, so curl waits until -m 3 (3 s) and exits with code 28.
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: lab-netpol
  labels:
    app: frontend
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 200m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: lab-netpol
  labels:
    app: intruder
spec:
  terminationGracePeriodSeconds: 1
