# Solution to exercise 2: default-deny BOTH directions in lab-netpol-other,
# plus DNS.
#
# One policy can cover both directions: list both policyTypes and give no
# rules. Result: nothing can reach the pods in lab-netpol-other, and they
# can't open connections to anything except CoreDNS - so even though
# backend (05) would accept them, lab-netpol-other/* -> backend is now
# blocked on the CLIENT side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lab-netpol-other
  labels:
    app: lab-netpol
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lab-netpol-other
  labels:
    app: lab-netpol
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
