# Solution to exercise 3: select namespaces by a label you choose.
#
#   kubectl label namespace lab-netpol-other team=web
#
# Now every namespace labelled team=web may reach backend:80 - including
# namespaces created later. Convenient, but think about WHO can label
# namespaces: anyone with "patch namespaces" can add team=web to their own
# namespace and get in. kubernetes.io/metadata.name can't be changed, which
# is why it's the safer choice for allow-lists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-team-web
  namespace: lab-netpol
  labels:
    app: backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              team: web
      ports:
        - protocol: TCP
          port: 80
