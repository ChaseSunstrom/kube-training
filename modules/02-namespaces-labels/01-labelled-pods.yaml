# 01 - Six small pods with different labels, to practise selectors on.
#
#   app    web | api                    what it is
#   env    dev | qa | prod              where it belongs
#   tier   frontend | backend
#   track  stable | canary              only on the prod pods
#
#   kubectl apply -f modules/02-namespaces-labels/01-labelled-pods.yaml
#   kubectl get pods -n lab-namespaces --show-labels
#   kubectl get pods -n lab-namespaces -L env,tier,track
#   kubectl get pods -n lab-namespaces -l 'env in (dev,qa)'
#
# Labels = identifying key/values you SELECT on (short, restricted charset).
# Annotations = non-identifying metadata for humans and tools (any text,
# can be large, cannot be selected on).
apiVersion: v1
kind: Pod
metadata:
  name: web-dev
  namespace: lab-namespaces
  labels: { app: web, env: dev, tier: frontend }
  annotations:
    training/description: "Web frontend, dev environment"
    training/owner: "team-web@example.com"
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 20m, memory: 16Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: web-qa
  namespace: lab-namespaces
  labels: { app: web, env: qa, tier: frontend }
spec:
  containers:
