---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod
  namespace: lab-namespaces
  labels: { app: web, env: prod, tier: frontend, track: stable }
  annotations:
    # Annotations can hold things labels can't: URLs, JSON, long text.
    training/runbook: "https://wiki.example.com/runbooks/web"
    training/git-commit: "3f9c2a1d4e5b6f708192a3b4c5d6e7f8091a2b3c"
spec:
