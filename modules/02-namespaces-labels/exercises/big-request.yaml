# Exercise 3 - this pod is rejected in lab-namespaces-team-a. By whom, and why?
#
#   kubectl delete replicaset filler -n lab-namespaces-team-a   # make room first (pods quota)
#   kubectl apply -f modules/02-namespaces-labels/exercises/big-request.yaml
#
# Change ONLY the cpu values until the pod is accepted. Two different
# admission plugins will stop you on the way - read each error message.
apiVersion: v1
kind: Pod
metadata:
  name: big-request
  namespace: lab-namespaces-team-a
  labels:
    app: big-request
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
      resources:
        requests: { cpu: 600m, memory: 32Mi }
        limits: { cpu: 600m, memory: 64Mi }
