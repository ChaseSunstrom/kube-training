# Solution to exercise 4: let a second team attach routes to the shared
# Gateway - but only namespaces that the platform team has labelled.
#
# 1. Both namespaces get the label training.example.com/gateway-access=true
#    (lab-ingress too - otherwise our own routes would lose access!).
# 2. The team's namespace gets an app and an HTTPRoute.
# 3. The Gateway's http listener switches from "Same" to a namespace Selector.
#    (kubectl apply this whole file; it re-applies 06 with that change.)
# Only someone allowed to label namespaces can now grant Gateway access.
# Clean up: kubectl delete namespace lab-ingress-team ; re-apply 06-gateway.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: lab-ingress
  labels:
    app: lab-ingress
    training.example.com/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-ingress-team
  labels:
    app: lab-ingress
    training.example.com/gateway-access: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-app
  namespace: lab-ingress-team
  labels:
    app: team-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-app
  template:
    metadata:
      labels:
        app: team-app
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=hello from the team namespace"]
          ports:
            - name: http
              containerPort: 5678
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: team-app
  namespace: lab-ingress-team
  labels:
    app: team-app
spec:
  selector:
    app: team-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team
  namespace: lab-ingress-team
  labels:
    app: team-app
spec:
  parentRefs:
    - name: lab-gateway
      namespace: lab-ingress      # the Gateway lives in another namespace
      sectionName: http
  hostnames:
    - team.gw.localhost
  rules:
    - backendRefs:
        - name: team-app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  gatewayClassName: lab-traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "*.gw.localhost"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              training.example.com/gateway-access: "true"
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: "*.gw.localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: lab-tls
      allowedRoutes:
        namespaces:
          from: Same
