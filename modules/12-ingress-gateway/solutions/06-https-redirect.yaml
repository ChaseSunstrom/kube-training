# Solution to exercise 6: redirect http://whoami.gw.localhost to https.
#
# Two routes for the same hostname, one per listener (sectionName):
#   http  listener -> RequestRedirect filter (no backendRefs at all)
#   https listener -> the real backend
# This replaces 07-httproute.yaml (same name "whoami", now https only).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-redirect
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: http
  hostnames:
    - whoami.gw.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: https
  hostnames:
    - whoami.gw.localhost
  rules:
    - backendRefs:
        - name: whoami
          port: 80
