# 08 - HTTPRoute matching and filters.
#
# Within a route, the MOST SPECIFIC match wins (exact path > longest prefix >
# method > number of header matches ...), not the order in the file.
#
#   echo.gw.localhost  with header "X-Canary: true"  -> echo-v2
#   echo.gw.localhost  /v1... (PathPrefix)           -> echo-v1
#   echo.gw.localhost  /api/... (PathPrefix)         -> whoami, with the
#                      prefix /api REWRITTEN to / and an extra request header
#   anything else on echo.gw.localhost               -> 404
#
# Things Ingress needed controller-specific annotations for - header matching,
# rewrites, header modification - are part of the standard API here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: http           # only the plain-HTTP listener
  hostnames:
    - echo.gw.localhost
  rules:
    - matches:
        - headers:
            - name: X-Canary
              value: "true"
      backendRefs:
        - name: echo-v2
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: echo-v1
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Routed-By
                value: lab-gateway
      backendRefs:
        - name: whoami
          port: 80
