# 09 - Traffic splitting (canary / blue-green) with backendRef weights.
#
# 90% of requests to canary.gw.localhost go to echo-v1, 10% to echo-v2.
# Weights are relative (9:1 is the same as 90:10); weight 0 = no traffic.
# A typical canary rollout just edits these two numbers: 90/10 -> 50/50 ->
# 0/100. Ingress has no standard way to do this.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: http
  hostnames:
    - canary.gw.localhost
  rules:
    - backendRefs:
        - name: echo-v1
          port: 80
          weight: 90
        - name: echo-v2
          port: 80
          weight: 10
