# 07 - HTTPRoute: the Gateway API's equivalent of an Ingress rule.
#
# parentRefs attaches the route to a Gateway. Without sectionName it attaches
# to EVERY listener whose hostname matches - here both http and https, so
# whoami.gw.localhost works on port 80 and 443.
#
# Check that it was accepted:
#   kubectl -n lab-ingress get httproute whoami -o yaml   # status.parents[].conditions
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: lab-ingress
  labels:
    app: lab-ingress
spec:
  parentRefs:
    - name: lab-gateway
  hostnames:
    - whoami.gw.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
