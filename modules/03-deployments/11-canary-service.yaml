# 11 - The canary Service: selects app=api only, NOT `track`, so it includes
# both the stable and the canary pods.
#
#   kubectl apply -f modules/03-deployments/11-canary-service.yaml
#   kubectl exec -n lab-deployments client -- \
#     sh -c 'for i in $(seq 100); do curl -s http://api | grep Name; done' | sort | uniq -c
#   ->  ~80 Name: api stable (v1)
#       ~20 Name: api canary (v2)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab-deployments
  labels:
    app: api
spec:
  selector:
    app: api              # deliberately no `track`
  ports:
    - name: http
      port: 80
      targetPort: http
