# 08 - Blue/green: two complete Deployments, side by side.
#
# "blue" is the live version, "green" the new one. Both run at full size;
# the Service (09) decides which one gets ALL the traffic, through one label:
# `color`. Switching is a one-line Service change - instant, and rollback is
# the same one line. The cost: twice the capacity while both exist.
#
#   kubectl apply -f modules/03-deployments/08-blue-green.yaml
#   kubectl get pods -n lab-deployments -l app=shop -L color
#
# Each Deployment's selector includes `color`, so the two never fight over
# each other's pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-blue
  namespace: lab-deployments
  labels:
    app: shop
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
      color: blue
  template:
    metadata:
      labels:
        app: shop
        color: blue
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          env:
            - name: WHOAMI_NAME
              value: "shop blue (v1)"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-green
  namespace: lab-deployments
  labels:
    app: shop
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
      color: green
  template:
    metadata:
      labels:
        app: shop
        color: green
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          env:
            - name: WHOAMI_NAME
              value: "shop green (v2)"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
