# Exercise 3 - a batch pod with an old-style sidecar that never finishes.
#
# The "app" container does its work and exits 0, but the pod never finishes
# (READY 1/2, STATUS NotReady, phase still Running) because the "proxy"
# sidecar is a normal container that never exits.
#
#   kubectl apply -f modules/01-pods/exercises/classic-sidecar.yaml
#   kubectl get pod classic-sidecar -n lab-pods -w     # 2/2 Running -> 1/2 NotReady ... forever
#
# Turn "proxy" into a native sidecar so the pod reaches Completed by itself.
apiVersion: v1
kind: Pod
metadata:
  name: classic-sidecar
  namespace: lab-pods
  labels:
    app: classic-sidecar
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo working; sleep 5; echo done"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 50m, memory: 16Mi }
    - name: proxy
      image: busybox:1.37
      command: ["sh", "-c", "trap 'exit 0' TERM; echo proxy up; sleep infinity & wait"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 50m, memory: 16Mi }
