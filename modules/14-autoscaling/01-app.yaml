# 01 - The workload we autoscale: "web", a small HTTP server.
#
# traefik/whoami's /data endpoint generates a response of the requested size,
# so every request costs a little CPU - enough for a load generator to push
# the pods well past their CPU request.
#
# The one thing HPA needs from this manifest: resources.requests.cpu.
# CPU *utilization* = current CPU usage / REQUESTED CPU. Without a request
# there is nothing to divide by, and the HPA reports
#   "failed to get cpu utilization: missing request for cpu"
# (same for memory utilization and memory requests).
#
# replicas: 1 here is only the starting point. Once an HPA manages this
# Deployment, the HPA owns spec.replicas, and every `kubectl apply` of this
# file resets it to 1 for a moment - Exercise 3 shows how to hand the field
# over to the HPA properly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-autoscaling
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m          # 100% utilization = 50 millicores
              memory: 16Mi
            limits:
              cpu: 200m         # keeps one pod from eating a whole laptop core
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-autoscaling
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
