# Solution to exercise 2: a cautious HPA.
#
#   scale-up:   at most +1 pod every 30 s, and only if the higher replica
#               count has been recommended for 30 s (stabilization window)
#   scale-down: wait until the lower count has been recommended for 2 min,
#               then remove at most 50% of the pods per minute
# tolerance (available on Kubernetes 1.37): ignore changes within 5% of the
# target instead of the cluster default of 10%. It is set per direction, so
# it appears under both scaleUp and scaleDown.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: lab-autoscaling
  labels:
    app: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      tolerance: "0.05"
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      tolerance: "0.05"
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
