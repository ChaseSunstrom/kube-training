# 01 - A node agent: exactly one pod on every (eligible) node.
#
# A DaemonSet has no "replicas". The controller works out which nodes the pod
# may run on and creates one pod per node - including nodes that join the
# cluster later. Remove a node and its pod goes with it.
#
# This agent does what log shippers (Fluent Bit, Vector), monitoring agents
# (node-exporter) and security agents do: it reads the NODE's filesystem via a
# read-only hostPath mount and reports which node it is on.
#
# Where does it run? Only on the two workers. The control-plane node has the
# taint node-role.kubernetes.io/control-plane:NoSchedule, and this pod has no
# matching toleration (compare with 02-daemonset-all-nodes.yaml).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: lab-daemonsets
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent           # immutable after creation
  updateStrategy:
    type: RollingUpdate         # or OnDelete
    rollingUpdate:
      # Defaults written out: replace one node's pod at a time, and stop the
      # old pod BEFORE starting the new one (so a node briefly has no agent).
      # maxSurge: 1 + maxUnavailable: 0 would start the new pod first instead
      # (not possible if the pod uses a hostPort - two pods can't bind it).
      maxUnavailable: 1
      maxSurge: 0
  # A new pod must be Ready for this long before the rollout moves on.
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: busybox:1.37
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_VERSION
              value: "1.0"
          command:
            - sh
            - -c
            - |
              trap 'exit 0' TERM
              while true; do
                echo "$(date +%T) agent v$AGENT_VERSION on $NODE_NAME sees $(ls /host/var/log/pods | wc -l) pod log dirs"
                sleep 30 & wait $!
              done
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
