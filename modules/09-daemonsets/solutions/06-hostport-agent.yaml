# Solution to exercise 6 - an agent reachable on every node's IP, and why it
# can't use maxSurge.
#
# hostPort: 19100 makes each node forward <node-IP>:19100 to its agent pod -
# the way node-exporter (port 9100) is often exposed to a Prometheus outside
# the pod network. Only ONE pod per node can hold a given hostPort.
#
#   kubectl apply -f solutions/06-hostport-agent.yaml
#   NODE_IP=$(kubectl get node kube-training-worker -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
#   kubectl run curl -n lab-daemonsets --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- -s http://$NODE_IP:19100/
#
# Now try a surge rollout:
#   kubectl patch ds metrics-agent -n lab-daemonsets -p '{"spec":{"updateStrategy":{"rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}}'
#   kubectl set env ds/metrics-agent -n lab-daemonsets VERSION=2
# The surge pod stays Pending ("didn't have free ports for the requested pod
# ports") because the old pod still holds 19100 on that node, and the old pod
# is only removed once the new one is ready: the rollout is stuck. Put
# maxSurge back to 0 / maxUnavailable to 1 and the rollout completes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metrics-agent
  namespace: lab-daemonsets
  labels:
    app: metrics-agent
spec:
  selector:
    matchLabels:
      app: metrics-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: metrics-agent
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: busybox:1.37
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              mkdir -p /www
              echo "node_agent_up{node=\"$NODE_NAME\"} 1" > /www/index.html
              exec httpd -f -p 9100 -h /www
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 19100
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
