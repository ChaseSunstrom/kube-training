# Capstone reference solution - the "lab" environment.
#
#   kubectl apply -k modules/19-capstone/solutions/overlays/lab
#   ./modules/19-capstone/verify.sh
#   kubectl delete -k modules/19-capstone/solutions/overlays/lab
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base

namespace: lab-capstone

labels:
  - pairs:
      env: lab
    includeSelectors: false
    includeTemplates: true

# Credentials -> Secret "db-credentials", generated from db.env.
# Deliberately WITHOUT the hash suffix: PostgreSQL reads POSTGRES_PASSWORD
# only when it initialises an empty data directory, so rolling the database
# on a Secret change would suggest a password change that never happens.
# Rotating a DB password is a deliberate procedure (README exercise 4).
# A stable name also lets one-off Jobs (extras/restore-job.yaml) refer to it.
secretGenerator:
  - name: db-credentials
    envs:
      - db.env
    options:
      disableNameSuffixHash: true

# Pin the frontend image by digest (module 15/17): the tag stays readable,
# the digest guarantees the exact bytes.
images:
  - name: nginx
    newTag: 1.27-alpine
    digest: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10

patches:
  # The one place to set your ingress controller's class (kubectl get ingressclass).
  - target:
      kind: Ingress
      name: capstone
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: nginx
