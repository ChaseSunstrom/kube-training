# PostgreSQL 16 as a single-replica StatefulSet with its own PVC.
#
# Why a StatefulSet and not a Deployment: stable identity (db-0), a PVC per
# replica from volumeClaimTemplates that survives pod deletion, and ordered,
# one-at-a-time rollouts - never two postgres processes on the same data.
# (Real production databases: use an operator such as CloudNativePG - it
#  handles replication, failover, backups and upgrades.)
#
# Credentials come from the db-credentials Secret (generated by the overlay).
# NOTE: POSTGRES_PASSWORD is only used when the data directory is EMPTY (first
# start). Changing the Secret later does not change the password inside the
# database - you'd run ALTER USER for that.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: lab-capstone
  labels:
    app: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30     # let postgres shut down cleanly (fast shutdown on SIGTERM)
      securityContext:
        runAsNonRoot: true
        runAsUser: 70           # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials       # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
          env:
            # A SUBdirectory of the volume: initdb insists on owning its data
            # directory with mode 0700, which it can't do to the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run               # unix socket + lock file
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          startupProbe:               # first start runs initdb - give it time
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -q -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: db
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
