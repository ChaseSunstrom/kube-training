# The frontend: nginx serving a static page and proxying /api/ to the backend.
# Same non-root, read-only recipe as module 15's nginx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-capstone
  labels:
    app: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: training/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: conf,  mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: html,  mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            - { name: tmp,   mountPath: /tmp }
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: frontend-nginx
        - name: html
          configMap:
            name: frontend-html
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
