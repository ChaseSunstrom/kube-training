# nginx server for the capstone frontend (mounted at /etc/nginx/conf.d/).
# - serves the static page on /
# - proxies /api/ to the backend Service, keeping the /api prefix
# - /healthz for the probes
# Runs as non-root, so it listens on 8080 (module 15).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # "backend" is resolved once at startup via cluster DNS. That's fine
        # because a Service's ClusterIP never changes while it exists.
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
