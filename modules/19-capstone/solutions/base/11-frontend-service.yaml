# Service for the frontend; the Ingress routes to it. Port 80 outside,
# 8080 (non-root nginx) inside.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lab-capstone
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
