# Headless Service for the PostgreSQL StatefulSet.
#
# clusterIP: None gives every StatefulSet pod a stable DNS name
# (db-0.db.lab-capstone.svc.cluster.local) and makes "db" resolve straight to
# the pod IP(s). Clients just use host "db", port 5432. (module 07)
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: lab-capstone
  labels:
    app: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
