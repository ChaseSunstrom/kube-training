# 06 - Consuming a Secret: as an env var and as files.
#
#   DB_USER          <- one key via secretKeyRef (same shape as configMapKeyRef)
#   /etc/db/*        <- every key as a file, permission 0400, on a tmpfs
#
# Prefer files over env vars for real secrets:
#   * env vars leak easily (crash dumps, "env" in debug sessions, child
#     processes, `kubectl describe`-style tooling, logs of misbehaving apps);
#   * mounted Secret files are refreshed when the Secret changes (unless you
#     use subPath), env vars never are.
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: lab-config
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo \"DB_USER=$DB_USER\"; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: username
      volumeMounts:
        - name: db
          mountPath: /etc/db
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
  volumes:
    - name: db
      secret:
        secretName: db-creds
        defaultMode: 0400   # owner read-only (YAML octal; JSON would need 256)
