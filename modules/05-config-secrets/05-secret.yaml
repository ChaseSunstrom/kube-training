# 05 - An Opaque Secret written as YAML.
#
# Secrets look like ConfigMaps, with a few differences:
#   * values under "data" are BASE64-ENCODED. Base64 is an encoding, not
#     encryption - anyone who can read the object can decode it.
#   * "stringData" lets you write plain text; the API server encodes it into
#     "data" for you. stringData is write-only: it never comes back on a GET.
#     If a key is in both, stringData wins.
#   * the kubelet stores Secret volumes in tmpfs (RAM) on the node, never on
#     the node's disk.
#   * RBAC usually treats them more strictly (get/list/watch on secrets is a
#     powerful permission - "list" returns every value in the namespace).
#
# WARNING: never commit real secrets to git like this file does. Use one of
# the approaches in the README ("Secrets in real life").
#
# Created the imperative way it would be:
#   kubectl create secret generic db-creds -n lab-config \
#     --from-literal=username=admin --from-literal=password='s3cr3t-P@ss'
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: lab-config
  labels:
    app: config-demo
type: Opaque            # the default type: arbitrary user data
data:
  # echo -n admin | base64     (-n matters! without it you encode "admin\n")
  username: YWRtaW4=
stringData:
  password: s3cr3t-P@ss
  # A whole file can live in a Secret too.
  db.conf: |
    host=postgres.lab-config.svc.cluster.local
    port=5432
    sslmode=require
