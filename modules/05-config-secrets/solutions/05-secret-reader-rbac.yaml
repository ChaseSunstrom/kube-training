# Solution to exercise 5 - let ONE ServiceAccount read ONE Secret.
#
# resourceNames restricts "get" to db-creds. Note that "list" and "watch"
# cannot be meaningfully restricted by resourceNames for collection requests,
# and "list" on secrets returns every value in the namespace - so it is not
# granted here. More in modules/11-rbac.
#
#   kubectl apply -f solutions/05-secret-reader-rbac.yaml
#   SA=system:serviceaccount:lab-config:projected-demo
#   kubectl auth can-i get secret/db-creds   -n lab-config --as=$SA   # yes
#   kubectl auth can-i get secret/api-key-v1 -n lab-config --as=$SA   # no
#   kubectl auth can-i list secrets          -n lab-config --as=$SA   # no
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-db-creds
  namespace: lab-config
  labels:
    app: projected-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["db-creds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-db-creds
  namespace: lab-config
  labels:
    app: projected-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-db-creds
subjects:
  - kind: ServiceAccount
    name: projected-demo
    namespace: lab-config
