# Solution to exercise 3 - nginx with a config file from a ConfigMap.
#
# default.conf is dropped into /etc/nginx/conf.d/ with subPath, so the other
# files the image ships in that directory stay visible. Trade-off: a subPath
# mount is NOT refreshed when the ConfigMap changes. The alternative is to
# mount the whole ConfigMap as /etc/nginx/conf.d (hides the image's files,
# but updates arrive) - and nginx still needs "nginx -s reload" (or a pod
# restart) to re-read its config either way.
#
# This is the finished version, with default_type already added. Without that
# line nginx answers /healthz with Content-Type: application/octet-stream
# (the default from the image's nginx.conf).
#
#   kubectl apply -f solutions/03-nginx-custom-conf.yaml
#   kubectl rollout status deploy/nginx-custom -n lab-config
#   kubectl exec -n lab-config deploy/nginx-custom -- wget -qSO- localhost:8080/healthz
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: lab-config
  labels:
    app: nginx-custom
data:
  default.conf: |
    server {
      listen 8080;
      default_type text/plain;
      location /healthz {
        add_header X-Config-Source configmap;
        return 200 "ok\n";
      }
      location / {
        root /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-custom
  namespace: lab-config
  labels:
    app: nginx-custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-custom
  template:
    metadata:
      labels:
        app: nginx-custom
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
