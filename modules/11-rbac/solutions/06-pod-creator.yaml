# Exercise 6, part 1 (apply as yourself): an identity that may ONLY create pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-creator
  namespace: lab-rbac
  labels:
    app: pod-creator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-creator
  namespace: lab-rbac
  labels:
    app: pod-creator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-creator
  namespace: lab-rbac
  labels:
    app: pod-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-creator
subjects:
  - kind: ServiceAccount
    name: pod-creator
    namespace: lab-rbac
