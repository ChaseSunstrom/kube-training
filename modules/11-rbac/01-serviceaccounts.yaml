# 01 - ServiceAccounts: identities for PROCESSES (pods), not for people.
#
# Every namespace automatically gets a ServiceAccount called "default", and a
# pod that doesn't set spec.serviceAccountName runs as it. "default" has no
# permissions beyond what every authenticated identity gets (API discovery,
# "who am I?"), and you should keep it that way: give each workload its OWN
# ServiceAccount and grant that one exactly what it needs.
#
# A ServiceAccount is just a name. It holds no permissions itself - those
# come from RoleBindings / ClusterRoleBindings that mention it (04-06).
# Its full username in RBAC rules and in `kubectl auth can-i --as=...` is
#   system:serviceaccount:<namespace>:<name>
# and it is a member of the groups
#   system:serviceaccounts  and  system:serviceaccounts:<namespace>
---
# Used by the in-cluster kubectl pod (03) and given read access to pods (04).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-viewer
  namespace: lab-rbac
  labels:
    app: pod-viewer
---
# Used with a ClusterRole reused through a RoleBinding (05).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: lab-rbac
  labels:
    app: config-reader
---
# Gets the built-in "view" ClusterRole, but only inside lab-rbac (05).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: lab-rbac
  labels:
    app: viewer
---
# Gets a cluster-wide permission through a ClusterRoleBinding (06).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-watcher
  namespace: lab-rbac
  labels:
    app: node-watcher
---
# Most pods never talk to the API server. For those, don't mount a token at
# all: a stolen token can't be abused if it isn't there. A pod can override
# this with spec.automountServiceAccountToken (the pod setting wins).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-api-access
  namespace: lab-rbac
  labels:
    app: no-api-access
automountServiceAccountToken: false
