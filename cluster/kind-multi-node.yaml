# kind cluster used by every module in this repo.
#
#   kind create cluster --config cluster/kind-multi-node.yaml
#
# Written for kind v0.33.0, whose default node image is Kubernetes v1.37.0.
# (Pin a version with --image kindest/node:v1.37.0 if you need to.)
#
# 1 control-plane + 2 workers, so you can actually see scheduling, node
# affinity, anti-affinity and "which node is my volume on?" behaviour.
#
# The control-plane node is labelled ingress-ready=true and maps host ports
# 80/443 so the ingress module (modules/12-ingress-gateway) works on
# http://localhost without port-forwarding.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kube-training
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort used in modules/04-services
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
    labels:
      training/zone: zone-a
  - role: worker
    labels:
      training/zone: zone-b
