name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0      # default node image: kindest/node:v1.37.0
  KUBECTL_VERSION: v1.37.1

jobs:
  manifests:
    name: Schema-check manifests (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          sudo curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client
      - name: Install helm
        uses: azure/setup-helm@v4
      - name: Validate
        run: scripts/validate.sh

  rwo-scenario:
    name: RWO ordered-pods scenario on kind
    runs-on: ubuntu-latest
    needs: manifests
    steps:
      - uses: actions/checkout@v4
      - name: Install kind and kubectl
        run: |
          sudo curl -fsSLo /usr/local/bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kind /usr/local/bin/kubectl
      - name: Create the training cluster
        run: kind create cluster --config cluster/kind-multi-node.yaml --wait 180s
      - name: Run all four patterns
        run: scenarios/rwo-pvc-ordered-pods/test.sh
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
